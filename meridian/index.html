<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#f6f3fb;color:#241c3a;text-align:center}
.b{max-width:340px;padding:24px}h1{font-size:22px;margin:0 0 8px}p{color:#5b5370;line-height:1.5}
.d{width:36px;height:36px;border-radius:50%;border:4px solid #d9d0ee;border-top-color:#6b4fd8;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="b"><div class="d"></div><h1>Opening Meridian…</h1><p id="m">One moment, finding the meeting recorder.</p></div>
<script>
var API="https://api.github.com/repos/harikrishnadhavalkumar-cloud/harikrishnadhavalkumar-cloud.github.io/contents/meridian/current.json";
function say(t){document.getElementById("m").textContent=t}
async function cur(){var r=await fetch(API+"?t="+Date.now(),{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"});return (await r.json()).url}
async function alive(u){try{var c=new AbortController();setTimeout(function(){c.abort()},6000);var r=await fetch(u+"/api/health?t="+Date.now(),{signal:c.signal,cache:"no-store"});return r.ok}catch(e){return false}}
async function go(n){
 try{var u=await cur();if(await alive(u)){location.replace(u+"/");return}}catch(e){}
 say("Meridian is waking up. This can take 1–2 minutes… (try "+(n+1)+")");
 setTimeout(function(){go(n+1)},8000)}
go(0);
</script></body></html>
