<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Executive Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* MERIDIAN EXECUTIVE REPORT v2: espresso, bronze and neon gold. Aurora glow, glass cards with gold hairlines, slide pages. Read it and you know the whole meeting. */
:root{--bg0:#0B0603;--cream:#F7EAD8;--soft:#CDB394;--mute:#8F7660;--edge:rgba(224,179,106,.2);--edge2:rgba(224,179,106,.42);
  --copper:#C77D45;--gold:#E0B36A;--champ:#F3D9A8;--neon:#FFD27A;
  --metal:linear-gradient(115deg,#9A5B2E,#C77D45 22%,#E0B36A 48%,#F3D9A8 62%,#E0B36A 78%,#B8742F);
  --panel:linear-gradient(160deg,rgba(255,232,200,.085),rgba(255,232,200,.022));
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg0);scroll-snap-type:y proximity;scroll-behavior:smooth}
body{margin:0;font:15px/1.65 var(--body);font-weight:500;color:var(--cream);background:var(--bg0);padding:26px max(16px,env(safe-area-inset-left,0px)) 70px;position:relative;min-height:100vh}
[hidden]{display:none!important}
/* aurora behind everything (screen only) */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(closest-side,#7A3E18,transparent 70%);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:10vmax;background:radial-gradient(closest-side,#B07A2A,transparent 70%);opacity:.32;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:48vmax;height:48vmax;left:20vmax;bottom:-26vmax;background:radial-gradient(closest-side,#5C2B14,transparent 70%);animation:drift3 38s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:30vmax;height:30vmax;right:12vmax;bottom:6vmax;background:radial-gradient(closest-side,#E0B36A,transparent 70%);opacity:.14;animation:drift1 44s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(7vmax,5vmax) scale(1.12)}}@keyframes drift2{to{transform:translate(-8vmax,6vmax) scale(.92)}}@keyframes drift3{to{transform:translate(6vmax,-6vmax) scale(1.1)}}
.tools,#root{position:relative;z-index:1}
.tools{max-width:1180px;margin:0 auto 18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.tools a,.tools button{font:700 13px var(--body);color:var(--cream);text-decoration:none;padding:10px 18px;border:1px solid var(--edge2);background:rgba(255,232,200,.06);border-radius:12px;cursor:pointer;transition:transform .3s,box-shadow .3s,background .3s;backdrop-filter:blur(10px)}
.tools a:hover,.tools button:hover{transform:translateY(-2px);background:rgba(255,232,200,.11);box-shadow:0 0 24px rgba(224,179,106,.18)}
.tools .go{background:var(--metal);color:#2A1608;border:0;box-shadow:0 10px 30px rgba(224,179,106,.32)}
.slide{max-width:1180px;margin:0 auto 26px;min-height:640px;border-radius:30px;border:1px solid var(--edge);
  background:radial-gradient(60% 50% at 0 0,rgba(199,125,69,.16),transparent 65%),radial-gradient(50% 45% at 100% 0,rgba(224,179,106,.13),transparent 65%),linear-gradient(160deg,rgba(40,25,15,.82) 0%,rgba(22,13,8,.86) 55%,rgba(14,8,5,.9) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 40px 110px rgba(0,0,0,.6),0 0 0 1px rgba(255,210,122,.04),inset 0 1px 0 rgba(255,235,205,.14),inset 0 0 90px rgba(224,179,106,.03);
  padding:54px 64px 40px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:24px;scroll-snap-align:start;scroll-margin-top:12px}
.slide::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,210,122,.55),rgba(224,179,106,0) 30%,rgba(224,179,106,0) 70%,rgba(255,210,122,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}
.slide::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(224,179,106,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(224,179,106,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 70% at 85% 8%,#000,transparent 75%);mask-image:radial-gradient(70% 70% at 85% 8%,#000,transparent 75%);pointer-events:none}
.slide>*{position:relative;z-index:1}
.slide{opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.slide.in{opacity:1;transform:none}
.slide .glass{opacity:0}
.slide.in .glass{animation:rise .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.corner{position:absolute!important;width:22px;height:22px;border:2px solid var(--gold);opacity:.75;z-index:2;filter:drop-shadow(0 0 6px rgba(255,210,122,.5))}
.corner.tl{left:20px;top:20px;border-right:0;border-bottom:0}.corner.br{right:20px;bottom:20px;border-left:0;border-top:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.18)}}
@keyframes blink{50%{opacity:.35}}
.eyebrow{font:500 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;text-shadow:0 0 14px rgba(255,210,122,.35)}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--metal);box-shadow:0 0 8px rgba(255,210,122,.7)}
h1,h2{margin:0;font-family:var(--display);font-weight:500;letter-spacing:-.03em;color:var(--cream)}
h1{font-size:clamp(30px,4.6vw,54px);line-height:1.06;overflow-wrap:anywhere}
h2{font-size:clamp(22px,2.9vw,32px);line-height:1.14}
.gold{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.8vw,20px);line-height:1.6;color:var(--cream);max-width:780px;font-weight:600}
.dim{color:var(--soft)}
.sub{margin:-12px 0 0;color:var(--soft);font-size:14px;max-width:760px}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.08em;padding:6px 14px;border:1px solid var(--edge2);border-radius:999px;color:var(--champ);background:rgba(255,232,200,.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tg.s{border-color:rgba(243,217,168,.55);color:#F3D9A8;background:rgba(243,217,168,.08)}
.tg.s::before{content:"\1F399";margin-right:6px;font-size:11px}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,235,205,.1),0 18px 44px rgba(0,0,0,.3);position:relative}
.foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:14px;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.body{margin-block:auto;display:grid;gap:22px;width:100%}
.ico{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* hero */
.cover{justify-content:space-between}
.cover .grid{display:grid;grid-template-columns:1.5fr .5fr;gap:34px;align-items:center;flex:1}
.cover h1{margin:16px 0 14px}
.orb{width:100%;max-width:250px;aspect-ratio:1;position:relative;justify-self:center}
.orb i{position:absolute;border-radius:50%}
.orb .core{inset:23%;background:radial-gradient(circle at 34% 28%,#FFF6E0,#F3D9A8 22%,#E0B36A 48%,#8A4F22 82%,#4A260F);box-shadow:0 0 50px 8px rgba(255,210,122,.5),0 0 130px 40px rgba(199,125,69,.32);animation:pulse 6s ease-in-out infinite}
.orb .r1{inset:8%;border:1px solid rgba(243,217,168,.55);animation:spin 40s linear infinite}
.orb .r1::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#FFE3A6;box-shadow:0 0 12px 3px rgba(255,210,122,.9)}
.orb .r2{inset:-2%;border:1px dashed rgba(224,179,106,.35);animation:spin 70s linear infinite reverse}
.orb .r2::after{content:"";position:absolute;right:6%;bottom:12%;width:6px;height:6px;border-radius:50%;background:#C77D45;box-shadow:0 0 10px 2px rgba(199,125,69,.9)}
.orb .halo{inset:-22%;background:conic-gradient(from 0deg,rgba(255,210,122,0),rgba(255,210,122,.16),rgba(199,125,69,0) 50%,rgba(255,210,122,.1),rgba(255,210,122,0));filter:blur(22px);animation:spin 24s linear infinite}
.catch{padding:24px 28px 22px;border-color:var(--edge2);background:linear-gradient(160deg,rgba(255,226,180,.11),rgba(255,226,180,.025));box-shadow:inset 0 1px 0 rgba(255,235,205,.16),0 0 0 1px rgba(255,210,122,.05),0 24px 60px rgba(0,0,0,.4),0 0 60px rgba(224,179,106,.08)}
.catch .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.catch .lab{font:500 11px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--neon);display:flex;align-items:center;gap:10px;text-shadow:0 0 16px rgba(255,210,122,.45)}
.catch .lab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 12px 3px rgba(255,210,122,.8);animation:blink 2.6s ease-in-out infinite}
.catch p{margin:0 0 10px;font-size:15.5px;line-height:1.72;color:var(--cream)}.catch p:last-child{margin:0}
.cov{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--champ);padding:6px 14px;border-radius:999px;border:1px solid rgba(143,211,164,.4);background:rgba(143,211,164,.08)}
.cov b{color:#9BE0B2;font-weight:500}.cov i{width:7px;height:7px;border-radius:50%;background:#9BE0B2;box-shadow:0 0 10px 2px rgba(155,224,178,.7)}
/* overview */
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;align-items:start}
.prose p{margin:0 0 16px;font-size:17px;line-height:1.75;color:var(--cream);font-weight:500}
.prose p:first-child::first-letter{font:500 44px/0.9 var(--display);float:left;margin:6px 10px 0 0;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.story{column-count:2;column-gap:46px}.story p{break-inside:avoid;margin:0 0 15px;font-size:15.5px;line-height:1.78;color:var(--cream)}.story p:first-child::first-letter{font:500 40px/0.9 var(--display);float:left;margin:6px 10px 0 0;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.side{display:grid;gap:14px}
.focus{padding:20px 22px}.focus .lab{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.focus b{display:block;margin-top:8px;font:500 20px/1.2 var(--display);letter-spacing:-.02em}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini div{padding:14px 16px}.mini b{display:block;font:500 21px/1 var(--display);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.mini span{display:block;margin-top:7px;font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tagrow{padding:16px 18px;display:grid;gap:10px}.tagrow .lab{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
/* takeaways */
.take{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:t}
.take li{counter-increment:t;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:18px 22px}
.take li::before{content:counter(t,decimal-leading-zero);font:500 26px/1.1 var(--display);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.take li span{font-size:17px;font-weight:700;line-height:1.55}
.next{display:grid;gap:9px}.next .it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 16px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--display);color:#2A1608;background:var(--metal);box-shadow:0 0 14px rgba(224,179,106,.35)}
.due{font:500 11px var(--mono);padding:4px 12px;border:1px solid var(--edge2);border-radius:999px;color:var(--champ);white-space:nowrap}
.banner{padding:12px 18px;border-radius:14px;border:1px dashed var(--edge2);color:var(--champ);font-weight:700;background:rgba(224,179,106,.07)}
/* timeline */
.rail{position:relative;display:grid;gap:14px;padding-left:30px}
.rail::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(255,210,122,.9),rgba(199,125,69,.5) 60%,rgba(199,125,69,.1));box-shadow:0 0 12px rgba(255,210,122,.45)}
.sec{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:16px 20px 15px;position:relative}
.sec::before{content:"";position:absolute;left:-27px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg0);border:2px solid var(--neon);box-shadow:0 0 12px 2px rgba(255,210,122,.7)}
.sec .tm{font:500 12px/1.35 var(--mono);color:var(--neon);letter-spacing:.04em;text-shadow:0 0 12px rgba(255,210,122,.35)}
.sec .tm small{display:block;color:var(--mute);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.sec h3{margin:0 0 7px;font:500 16.5px/1.25 var(--display);letter-spacing:-.02em}
.sec .two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.sec p{margin:0;font-size:14px;line-height:1.68;color:var(--cream)}
.sec ul{margin:0;padding-left:16px;display:grid;gap:3px;font-size:12.5px;line-height:1.5;color:var(--soft)}
.sec ul li::marker{color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{display:inline-flex;align-items:flex-start;gap:6px;font:600 11px/1.35 var(--body);padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,232,200,.045);color:var(--champ)}
.tg .ico{margin-top:1.5px}
.tg.d{color:#FFB070;border-color:rgba(255,154,82,.4)}.tg.t{color:#9ED0F0;border-color:rgba(130,190,235,.35)}.tg.k{color:#D8B6F5;border-color:rgba(200,160,240,.35)}.tg.n{color:var(--neon);border-color:rgba(255,210,122,.4)}.tg.c{color:#9BE0B2;border-color:rgba(143,211,164,.38)}
/* deadlines */
.dl{display:grid}
.dr{display:grid;grid-template-columns:116px 1.35fr 1.7fr auto;gap:18px;align-items:center;padding:13px 22px;border-bottom:1px solid var(--edge)}
.dr:last-child{border-bottom:0}.dr.h{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-block:12px}
.dr b{font-weight:700;font-size:15px;line-height:1.35;text-align:left}.dr>*{text-align:left}.dr>.who{text-align:right}.dr .dt{font-size:13px;color:var(--soft);line-height:1.5}.dr .dt strong{color:var(--cream);font-weight:700}
.st{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px 1px currentColor}
.st.new{color:#FFD27A;border-color:rgba(255,210,122,.5);background:rgba(255,210,122,.09)}.st.moved{color:#FF9A52;border-color:rgba(255,154,82,.55);background:rgba(255,154,82,.1)}
.st.confirmed{color:#9BE0B2;border-color:rgba(143,211,164,.5);background:rgba(143,211,164,.09)}.st.risk{color:#FF7A7A;border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.1)}.st.other{color:var(--soft);border-color:var(--edge2);background:rgba(255,232,200,.05)}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.who{font:500 11px var(--mono);color:var(--mute);white-space:nowrap;text-align:right}.who em{display:block;font-style:normal;color:var(--champ);font-size:12px}
/* tools */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tc{padding:20px 22px 18px;display:grid;gap:9px;align-content:start}
.tc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tc h3{margin:0;font:500 18px/1.2 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.tc p{margin:0;font-size:13.5px;line-height:1.6;color:var(--cream)}
.tc .cost{font:500 13px var(--mono);color:var(--neon);text-shadow:0 0 12px rgba(255,210,122,.3)}
.tc .note{font-size:12.5px;color:var(--soft);line-height:1.55;border-top:1px solid var(--edge);padding-top:9px}
.ac{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid;white-space:nowrap}
.ac.free{color:#9BE0B2;border-color:rgba(143,211,164,.5);background:rgba(143,211,164,.09)}.ac.paid{color:#E8955A;border-color:rgba(232,149,90,.5);background:rgba(232,149,90,.09)}
.ac.trial{color:#9ED0F0;border-color:rgba(130,190,235,.5);background:rgba(130,190,235,.09)}.ac.credits{color:#FFD27A;border-color:rgba(255,210,122,.5);background:rgba(255,210,122,.09)}
.ac.shared{color:#D8B6F5;border-color:rgba(200,160,240,.5);background:rgba(200,160,240,.09)}.ac.unknown{color:var(--soft);border-color:var(--edge2);background:rgba(255,232,200,.05)}
/* projects / numbers */
.pj{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pc{padding:20px 24px 18px;display:grid;gap:8px;align-content:start}
.pc .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pc h3{margin:0;font:500 17px/1.25 var(--display);letter-spacing:-.02em}
.pc p{margin:0;font-size:13.8px;line-height:1.65}
.pc .from{font:500 11px var(--mono);letter-spacing:.06em;color:var(--champ)}.pc .from em{color:var(--mute);font-style:normal;text-transform:uppercase;letter-spacing:.16em;font-size:10px;margin-right:6px}
.kd{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--edge2);color:var(--neon);background:rgba(255,210,122,.07);white-space:nowrap}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nm{padding:18px 20px 16px;display:grid;gap:6px;align-content:start}
.nm b{font:500 26px/1.1 var(--display);letter-spacing:-.03em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.nm span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--champ)}
.nm p{margin:0;font-size:12.5px;line-height:1.55;color:var(--soft)}
.sh{font:500 10.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 -8px}
/* topics */
.tpair{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.tp{padding:26px 28px 24px;display:grid;gap:12px;align-content:start}
.tp .th{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.tp .n{font:500 26px/1 var(--display);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.tp h3{margin:0;font:500 19px/1.2 var(--display);letter-spacing:-.02em}
.tp .pct{font:500 11px var(--mono);color:var(--champ);padding:4px 10px;border:1px solid var(--edge2);border-radius:999px}
.tp .bar{height:3px;border-radius:999px;background:rgba(255,232,200,.1);overflow:hidden}.tp .bar i{display:block;height:100%;background:var(--metal);box-shadow:0 0 10px rgba(255,210,122,.7);transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.tp p{margin:0;font-size:15px;line-height:1.75;color:var(--cream)}
.tp ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px;color:var(--soft)}
.tp .out{margin-top:2px;padding:11px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(224,179,106,.07);font-size:13.5px;font-weight:700}

    var when=new Date((m.created||Date.now()/1000)*1000);
    var dateTxt=when.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long",year:"numeric"}),timeTxt=when.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    var langTxt={hi:"Hindi + English",en:"English"}[m.language]||(m.language||"").toUpperCase();
    var firstSentence=(String(n.summary||"").match(/^[^.!?]+[.!?]?/)||[""])[0];
    var headline=n.headline||firstSentence||"A short meeting with limited content.";
    var kind=n.kind||"Team meeting";
    var generic=/^Meeting \d{1,2} \w{3}/.test(String(m.title||""));
    var coverTitle=(generic&&n.headline)?n.headline:(m.title||"Meeting");
    var shortTitle=generic?("Meeting · "+when.toLocaleDateString([], {day:"numeric",month:"short"})):(m.title||"Meeting");
    var overview=paras(n.overview||n.summary||"No summary was written.");
    var catchup=paras(n.catchup);var hasCatch=catchup.length>0;if(!hasCatch)catchup=overview.slice(0,1);
    var mainFocus=n.main_focus||(topics.length?topics.slice().sort(function(a,b){return (b.share||0)-(a.share||0)})[0].title:"");
    var keyPts=(arr(n.key_points).length?arr(n.key_points):decs.concat(acts.slice(0,3).map(function(a){return a.owner+": "+a.task}))).slice(0,6);
    var lowSignal=words<250||(decs.length===0&&acts.length===0&&!topics.length&&!secs.length);
    var oq=arr(n.open_questions);

    var KEY=/\b(decid|agree|will|launch|budget|deadline|by (mon|tues|wednes|thurs|fri|satur|sun)|invoice|plan|important|must|need to)\w*/i;
    var cand=segs.map(function(s){return{s:s,score:String(s.text||"").split(/\s+/).length+(KEY.test(s.text)?14:0)}}).filter(function(c){return String(c.s.text||"").split(/\s+/).length>=6}).sort(function(a,b){return b.score-a.score});
    var picked=[];cand.forEach(function(c){if(picked.length<3&&picked.every(function(p){return Math.abs(p.s.start-c.s.start)>25}))picked.push(c)});picked.sort(function(a,b){return a.s.start-b.s.start});

    var pages=[],corners='<i class="corner tl"></i><i class="corner br"></i>';
    var gi=function(i){return ' style="--i:'+i+'"'};
    var ORB='<div class="orb" aria-hidden="true"><i class="halo"></i><i class="r2"></i><i class="r1"></i><i class="core"></i></div>';

    /* A. hero: catch-up in 2 minutes */
    pages.push(function(){
      var covB=cov&&cov.terms_total?'<span class="cov"><i></i>Coverage check: <b>'+esc(cov.terms_found)+' of '+esc(cov.terms_total)+'</b> key items captured</span>':'';
      return '<section class="slide cover">'+corners+'<div class="eyebrow">Executive meeting report</div><div class="grid"><div><div class="chips"><span class="chip">'+esc(kind)+'</span><span class="chip">'+dur(total)+'</span><span class="chip">'+esc(langTxt)+(m.language==="en"?"":" · written in English")+'</span>'+covB+'</div><h1 style="margin-top:16px">'+esc(coverTitle)+'</h1>'+(headline&&headline!==coverTitle?'<p class="lead gold" style="margin:0 0 6px;max-width:none">'+esc(headline)+'</p>':'')+
        '<div class="glass catch" style="--i:1"><div class="ch"><span class="lab">'+(hasCatch?"Catch-up in 2 minutes":"The short version")+'</span><span class="chip">'+(hasCatch?catchup.join(" ").split(/\s+/).length+" words":"summary")+'</span></div>'+catchup.map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+'</div></div>'+ORB+'</div><div class="foot"><span>'+esc(dateTxt)+' · '+esc(timeTxt)+'</span><span>Prepared by Meridian</span><span>Confidential</span></div></section>'});

    /* B. everything that was discussed: timeline rail, paginated */
    var secWeight=function(s){return 150+sOf(s.summary)+arr(s.bullets).reduce(function(a,b){return a+sOf(b)*.75+14},0)*1+ ["decisions","deadlines","tasks","tools","numbers"].reduce(function(a,k){return a+arr(s[k]).reduce(function(b,c){return b+sOf(c)*.8+22},0)},0)*.8};
    var secPages=paginate(secs,secWeight,2250,4);
    secPages.forEach(function(group,pi){pages.push(function(foot){
      var a=group[0].start||0,b=group[group.length-1].end||group[group.length-1].start||0;
      return '<section class="slide">'+corners+'<div class="eyebrow">Everything that was discussed · '+mmss(a)+' to '+mmss(b)+'</div><h2>'+(pi===0?"The meeting, minute by minute":"The meeting, continued")+'</h2>'+(pi===0?'<p class="sub">'+secs.length+' parts in the order they happened, with every date, task, tool, number and decision attached to the moment it was said.</p>':'')+
        '<div class="body"><div class="rail">'+group.map(function(s,j){
          var tg=function(cls,k,list){return arr(list).map(function(x){return '<span class="tg '+cls+'">'+ico(k)+esc(txt(x))+'</span>'}).join("")};
          var tags=arr(s.speakers).map(function(x){return '<span class="tg s">'+esc(x)+'</span>'}).join("")+tg("c","flag",s.decisions)+tg("d","clock",s.deadlines)+tg("t","check",s.tasks)+tg("k","wrench",s.tools)+tg("n","hash",s.numbers);
          var bl=arr(s.bullets);
          return '<div class="glass sec"'+gi(j)+'><div class="tm">'+mmss(s.start)+(s.end!=null?' – '+mmss(s.end):'')+'<small>minute '+(Math.floor((s.start||0)/60)+1)+'</small></div><div><h3>'+esc(s.title||"Part "+(j+1))+'</h3><div class="'+(bl.length?'two':'')+'"><p>'+esc(s.summary||"")+'</p>'+(bl.length?'<ul>'+bl.map(function(x){return '<li>'+esc(txt(x))+'</li>'}).join("")+'</ul>':'')+'</div>'+(tags?'<div class="tags">'+tags+'</div>':'')+'</div></div>'}).join("")+'</div></div>'+foot()+'</section>'})});

    /* C. deadlines and date changes */
    var stCls=function(c){c=String(c||"").toLowerCase();return /moved|shift|postpone|delay/.test(c)?"moved":/risk|block|late/.test(c)?"risk":/confirm|fixed|locked/.test(c)?"confirmed":/new|set|added/.test(c)?"new":"other"};
    var stTxt={moved:"Moved",risk:"At risk",confirmed:"Confirmed",new:"New",other:""};
    var dlPages=paginate(dls,function(d){return 70+sOf(d.detail)*.55+sOf(d.item)},1500,6);
    dlPages.forEach(function(group,pi){pages.push(function(foot){
      var cnt={};dls.forEach(function(d){var c=stCls(d.change);cnt[c]=(cnt[c]||0)+1});
      var leg=["new","moved","confirmed","risk"].filter(function(c){return cnt[c]}).map(function(c){return '<span class="st '+c+'"><i></i>'+stTxt[c]+' · '+cnt[c]+'</span>'}).join("");
      return '<section class="slide">'+corners+'<div class="eyebrow">Deadlines and date changes</div><h2>'+(pi===0?"What is due, and what moved":"What is due, continued")+'</h2>'+(pi===0&&leg?'<div class="legend">'+leg+'</div>':'')+
        '<div class="body"><div class="glass dl"><div class="dr h"><span>Status</span><span>Item</span><span>What changed</span><span>Owner · when</span></div>'+group.map(function(d){var c=stCls(d.change);
          return '<div class="dr"><span class="st '+c+'"><i></i>'+esc(stTxt[c]||d.change||"Noted")+'</span><b>'+esc(d.item)+'</b><span class="dt">'+(d.detail?esc(d.detail):'<span class="dim">No extra detail.</span>')+'</span><span class="who">'+(d.owner?esc(d.owner)+'<em>':'<em>')+esc(d.date||"")+'</em></span></div>'}).join("")+'</div></div>'+foot()+'</section>'})});

    /* D. tools, access and credits */
    var acCls=function(a){a=String(a||"").toLowerCase();return /shared/.test(a)?"shared":/credit/.test(a)?"credits":/free/.test(a)?"free":/trial/.test(a)?"trial":/paid/.test(a)?"paid":"unknown"};
    var toolPages=paginate(tools,function(t){return 130+sOf(t.what)+sOf(t.note)},1100,6);
    toolPages.forEach(function(group,pi){pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">Tools, access and credits</div><h2>'+(pi===0?"What the team can use, and what it costs":"Tools, continued")+'</h2><div class="body"><div class="board">'+group.map(function(t,j){var c=acCls(t.access);
        return '<div class="glass tc"'+gi(j)+'><div class="top"><h3>'+esc(t.name)+'</h3><span class="ac '+c+'">'+esc(t.access||"unknown")+'</span></div>'+(t.what?'<p>'+esc(t.what)+'</p>':'')+(t.cost?'<div class="cost">'+esc(t.cost)+'</div>':'')+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>'}).join("")+'</div></div>'+foot()+'</section>'})});

    /* E. projects and numbers (one page if small, else split) */
    var projBlock=function(group){return '<div class="pj">'+group.map(function(p,j){return '<div class="glass pc"'+gi(j)+'><div class="top"><h3>'+esc(p.name)+'</h3>'+(p.kind?'<span class="kd">'+esc(p.kind)+'</span>':'')+'</div>'+(p.from?'<div class="from"><em>From</em>'+esc(p.from)+'</div>':'')+(p.detail?'<p>'+esc(p.detail)+'</p>':'')+'</div>'}).join("")+'</div>'};
    var numBlock=function(group){return '<div class="nums">'+group.map(function(x,j){return '<div class="glass nm"'+gi(j+2)+'><b>'+esc(x.value)+'</b><span>'+esc(x.label)+'</span>'+(x.context?'<p>'+esc(x.context)+'</p>':'')+'</div>'}).join("")+'</div>'};
    var combined=projs.length&&nums.length&&projs.length<=4&&nums.length<=8&&projs.reduce(function(a,p){return a+sOf(p.detail)},0)<700;
    if(combined)pages.push(function(foot){return '<section class="slide">'+corners+'<div class="eyebrow">Projects, requests and numbers</div><h2>New work, and the numbers behind it</h2><div class="body"><div class="sh">Projects and requests</div>'+projBlock(projs)+'<div class="sh">Numbers that mattered</div>'+numBlock(nums)+'</div>'+foot()+'</section>'});
    else{
      paginate(projs,function(p){return 120+sOf(p.detail)},1000,4).forEach(function(g,pi){pages.push(function(foot){return '<section class="slide">'+corners+'<div class="eyebrow">Projects and requests</div><h2>'+(pi===0?"New work, requests and ideas":"Projects, continued")+'</h2><div class="body">'+projBlock(g)+'</div>'+foot()+'</section>'})});
      paginate(nums,function(x){return 90+sOf(x.context)},1000,8).forEach(function(g,pi){pages.push(function(foot){return '<section class="slide">'+corners+'<div class="eyebrow">Numbers that mattered</div><h2>'+(pi===0?"The figures to remember":"Figures, continued")+'</h2><div class="body">'+numBlock(g)+'</div>'+foot()+'</section>'})});
    }

    /* overall summary */
    pages.push(function(foot){
      var chipsT=arr(men.terms).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join(""),chipsP=arr(men.people).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join("");
      return '<section class="slide">'+corners+'<div class="eyebrow">Overall summary</div><h2 class="gold" style="max-width:940px">'+esc(headline)+'</h2>'+(lowSignal?'<div class="banner">Low-signal meeting: very few decisions or tasks were spoken. The report shows what was discussed.</div>':'')+
        '<div class="body"><div class="cols"><div class="prose">'+(overview.length>1?overview.slice(0,1):overview).map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+(overview.length>1?'<p class="dim" style="font-size:14px">The full story, part by part, is on the next page.</p>':'')+'</div><div class="side">'+
        (mainFocus?'<div class="glass focus" style="--i:0"><div class="lab">Main focus</div><b>'+esc(mainFocus)+'</b></div>':'')+
        '<div class="mini"><div class="glass" style="--i:1"><b>'+dur(total)+'</b><span>Length</span></div><div class="glass" style="--i:2"><b>'+words.toLocaleString()+'</b><span>Words</span></div><div class="glass" style="--i:3"><b>'+(secs.length||topics.length)+'</b><span>'+(secs.length?"Parts":"Topics")+'</span></div><div class="glass" style="--i:4"><b>'+decs.length+'</b><span>Decisions</span></div><div class="glass" style="--i:5"><b>'+acts.length+'</b><span>Tasks</span></div><div class="glass" style="--i:6"><b>'+(dls.length||nums.length||0)+'</b><span>'+(dls.length?"Dates":"Numbers")+'</span></div></div>'+
        (chipsT?'<div class="glass tagrow"><div class="lab">Tools and terms mentioned</div><div class="chips">'+chipsT+'</div></div>':'')+(chipsP?'<div class="glass tagrow"><div class="lab">People mentioned</div><div class="chips">'+chipsP+'</div></div>':'')+
        '</div></div></div>'+foot()+'</section>'});

    if(overview.length>1)pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">How the meeting went</div><h2>The full story, in order</h2><div class="body"><div class="story">'+overview.map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+'</div></div>'+foot()+'</section>'});

    /* key takeaways + next moves */
    pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">Key takeaways</div><h2>What matters most</h2><div class="body"><div class="cols" style="grid-template-columns:1.6fr 1fr"><div>'+(keyPts.length?'<ol class="take">'+keyPts.map(function(k,i){return '<li class="glass"'+gi(i)+'><span>'+esc(k)+'</span></li>'}).join("")+'</ol>':'<div class="glass empty">Nothing stood out as a key point.</div>')+'</div>'+
        '<div><div class="eyebrow" style="margin-bottom:12px">Next moves</div>'+(acts.length?'<div class="next">'+acts.slice(0,4).map(function(a,i){return '<div class="glass it"'+gi(i+2)+'><div class="av">'+esc((a.owner||"?").charAt(0).toUpperCase())+'</div><span><b>'+esc(a.owner)+'</b> · '+esc(a.task)+'</span>'+(a.due?'<span class="due">'+esc(a.due)+'</span>':'<span></span>')+'</div>'}).join("")+'</div>':'<div class="glass empty">No tasks were given out.</div>')+'</div></div></div>'+foot()+'</section>'});

    /* topics, two to a page */
    for(var k=0;k<topics.length;k+=2)(function(pair,first){pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">What was discussed · topics '+(first+1)+(pair.length>1?" and "+(first+2):"")+' of '+topics.length+'</div><h2>'+(first===0?"Topic by topic":"Topic by topic, continued")+'</h2><div class="body"><div class="tpair">'+pair.map(function(t,j){
        var para=t.paragraph||t.summary||"";
        return '<div class="glass tp"'+gi(j)+'><div class="th"><div class="n">'+String(first+j+1).padStart(2,"0")+'</div><h3>'+esc(t.title)+'</h3>'+(t.share!=null?'<div class="pct">'+esc(t.share)+'%</div>':'<span></span>')+'</div>'+(t.share!=null?'<div class="bar"><i style="width:'+Math.max(3,+t.share||0)+'%"></i></div>':'')+'<p>'+esc(para)+'</p>'+(arr(t.points).length?'<ul>'+t.points.slice(0,4).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>':'')+(t.outcome?'<div class="out"><em>Outcome</em>'+esc(t.outcome)+'</div>':'')+(arr(t.questions).length?'<div class="q"><em>Open</em>'+esc(t.questions[0])+'</div>':'')+'</div>'}).join("")+'</div></div>'+foot()+'</section>'})})(topics.slice(k,k+2),k);

    /* decisions and action plan */
    pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">Decisions and action plan</div><h2>'+(decs.length?"What was decided, and who moves next":"What people committed to")+'</h2><div class="body"><div class="cols" style="grid-template-columns:'+(decs.length?"1fr 1.5fr":"1fr")+'">'+
        (decs.length?'<div style="display:grid;gap:12px;align-content:start">'+decs.map(function(d,i){return '<div class="glass dec"'+gi(i)+'><div class="dn">'+(i+1)+'</div><b>'+esc(d)+'</b></div>'}).join("")+'</div>':'')+
        '<div class="glass tbl" style="--i:1"><div class="tr h"><span></span><span>Owner</span><span>Action</span><span>When</span></div>'+(acts.map(function(a){return '<div class="tr"><div class="av">'+esc((a.owner||"?").charAt(0).toUpperCase())+'</div><b>'+esc(a.owner)+'</b><span>'+esc(a.task)+'</span>'+(a.due?'<span class="due">'+esc(a.due)+'</span>':'<span></span>')+'</div>'}).join("")||'<div class="empty">No action items were given out.</div>')+'</div></div>'+
        (oq.length?'<div class="glass oq" style="--i:3"><div class="eyebrow">Still open</div><ul style="margin:0;padding:0">'+oq.map(function(q){return '<li>'+esc(q)+'</li>'}).join("")+'</ul></div>':'')+'</div>'+foot()+'</section>'});

    /* highlights, hard-to-hear parts, appendix */
    pages.push(function(foot){
      return '<section class="slide">'+corners+'<div class="eyebrow">Highlights</div><h2>Lines worth remembering</h2><div class="body"><div style="display:grid;gap:12px">'+(picked.map(function(c,i){return '<div class="glass quote"'+gi(i)+'>'+esc(c.s.text)+'<small>'+esc(c.s.speaker)+' · '+mmss(c.s.start)+'</small></div>'}).join("")||'<div class="glass empty">Not enough speech for highlights.</div>')+'</div>'+
        (unclear.length?'<div class="glass hard" style="--i:4"><div class="eyebrow">Parts that were hard to hear</div><ul>'+unclear.slice(0,6).map(function(u){return '<li>'+esc(txt(u))+'</li>'}).join("")+'</ul></div>':'')+'</div>'+
        '<details class="glass"><summary>Appendix · full transcript (English)</summary><div class="tx">'+segs.map(function(s){return '<div><em>'+mmss(s.start)+'</em><b>'+esc(s.speaker)+'</b> '+esc(s.text)+'</div>'}).join("")+'</div></details>'+foot()+'</section>'});

    var N=pages.length,html="";
    pages.forEach(function(pg,i){html+=pg(function(){return '<div class="foot"><span>Meridian · Executive meeting report</span><span>'+esc(shortTitle)+'</span><span>'+String(i+1).padStart(2,"0")+' / '+String(N).padStart(2,"0")+'</span></div>'})});
    $("#root").innerHTML=html;
    document.title=(m.title||"Meeting")+" · Executive Report";
    var sl=document.querySelectorAll(".slide");
    if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.06});sl.forEach(function(s){io.observe(s)})}else sl.forEach(function(s){s.classList.add("in")});
    $("#copyBtn").onclick=function(){
      var L=function(a,f){return a.map(f).join("\n")||"- none"};
      var t=(m.title||"Meeting")+"\n"+headline+"\n\n"+(hasCatch?"CATCH-UP IN 2 MINUTES\n"+catchup.join("\n\n"):overview.join("\n\n"))+
        (secs.length?"\n\nMINUTE BY MINUTE\n"+secs.map(function(s){return mmss(s.start)+" "+(s.title||"")+"\n   "+(s.summary||"")}).join("\n"):"")+
        (dls.length?"\n\nDEADLINES\n"+L(dls,function(d){return "- "+d.item+" ("+(d.change||"")+"): "+(d.date||"")+(d.detail?" - "+d.detail:"")}):"")+
        (tools.length?"\n\nTOOLS AND ACCESS\n"+L(tools,function(x){return "- "+x.name+" ["+(x.access||"")+"] "+(x.cost||"")+(x.note?" - "+x.note:"")}):"")+
        (projs.length?"\n\nPROJECTS\n"+L(projs,function(p){return "- "+p.name+(p.from?" (from "+p.from+")":"")+": "+(p.detail||"")}):"")+
        (nums.length?"\n\nNUMBERS\n"+L(nums,function(x){return "- "+x.label+": "+x.value+(x.context?" ("+x.context+")":"")}):"")+
        "\n\nWHAT MATTERS MOST\n"+L(keyPts,function(k){return "- "+k})+"\n\nTOPICS\n"+topics.map(function(x,i){return (i+1)+". "+x.title+"\n   "+(x.paragraph||x.summary||"")+(x.outcome?"\n   Outcome: "+x.outcome:"")}).join("\n")+"\n\nDECISIONS\n"+L(decs,function(d){return "- "+d})+"\n\nACTION PLAN\n"+L(acts,function(a){return "- "+a.owner+": "+a.task+(a.due?" ("+a.due+")":"")})+(unclear.length?"\n\nHARD TO HEAR\n"+L(unclear,function(u){return "- "+txt(u)}):"");
      var b=$("#copyBtn"),ok=function(){var o=b.textContent;b.textContent="Copied";setTimeout(function(){b.textContent=o},1400)};try{navigator.clipboard.writeText(t).then(ok,function(){})}catch(e){}};
    $("#printBtn").onclick=function(){window.print()};
  }

  /* ---------- data: demo, embedded copy, or fetched from the server ---------- */
  var qs=new URLSearchParams(location.search),LSget=function(k){try{return localStorage.getItem(k)||""}catch(e){return ""}};
  if(qs.get("demo")){var dv=qs.get("demo");build(dv==="old"?oldDemo():dv==="long"?longDemo():DEMO);return}
  if(window.__MERIDIAN__){var bk=document.querySelector("#tools a");if(bk)bk.hidden=true;build(window.__MERIDIAN__);return}
  var id=qs.get("id");
  var msg=function(t){$("#root").innerHTML='<section class="slide in"><div class="eyebrow">Meridian executive report</div><p class="lead dim">'+t+'</p></section>'};
  if(!id){msg("No meeting chosen. Open the Meeting reports tab in Meridian and pick a meeting.");return}
  var h={"X-Meridian-Owner":LSget("meridian_o")};if(LSget("meridian_k"))h["X-Meridian-Key"]=LSget("meridian_k");
  __cloudGet(id,h).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){
    if(m.status!=="done"){msg("This meeting is still being written up. Reload in a minute.");return}build(m)}).catch(function(){msg("Could not open this meeting.")});
})();
