name: Meridian cloud helper
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the 25 minute wait (testing)"
        default: "false"
concurrency:
  group: meridian-brain
  cancel-in-progress: false
jobs:
  brain:
    runs-on: ubuntu-latest   # standard free runner only
    timeout-minutes: 350
    env:
      MERIDIAN_URL: ${{ secrets.MERIDIAN_URL }}
      MERIDIAN_ADMIN: ${{ secrets.MERIDIAN_ADMIN }}
      FORCE: ${{ inputs.force }}
      MERIDIAN_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
      MERIDIAN_LOCAL_MODEL: ${{ vars.LLM_MODEL || 'qwen2.5:3b' }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there anything waiting?
        id: check
        run: python3 meridian-brain/check.py
      - uses: actions/setup-python@v5
        if: steps.check.outputs.work == 'true'
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: steps.check.outputs.work == 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.ollama
          key: meridian-models-${{ env.MERIDIAN_MODEL }}-${{ env.MERIDIAN_LOCAL_MODEL }}
      - name: Install tools
        if: steps.check.outputs.work == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper==1.2.1 av==15.1.0 Flask==3.1.3 rapidfuzz
          curl -fsSL https://ollama.com/install.sh | sh
          (nohup ollama serve > ollama.log 2>&1 &) ; sleep 8
          ollama pull "$MERIDIAN_LOCAL_MODEL"
      - name: Write the notes
        if: steps.check.outputs.work == 'true'
        run: python3 meridian-brain/brain.py
