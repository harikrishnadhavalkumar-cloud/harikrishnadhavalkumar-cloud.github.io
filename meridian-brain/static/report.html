<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Executive Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* MERIDIAN EXECUTIVE REPORT v3: three text-first A4 landscape pages. Espresso, bronze, neon gold. */
:root{--bg0:#0B0603;--cream:#F7EAD8;--soft:#D3BB9D;--mute:#97806A;--edge:rgba(224,179,106,.2);--edge2:rgba(224,179,106,.42);
  --copper:#C77D45;--gold:#E0B36A;--champ:#F3D9A8;--neon:#FFD27A;
  --metal:linear-gradient(115deg,#9A5B2E,#C77D45 22%,#E0B36A 48%,#F3D9A8 62%,#E0B36A 78%,#B8742F);
  --panel:linear-gradient(160deg,rgba(255,232,200,.085),rgba(255,232,200,.022));
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:dark;--z:1}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:var(--bg0)}
body{margin:0;font:14px/1.6 var(--body);font-weight:500;color:var(--cream);background:var(--bg0);padding:22px 12px 60px;position:relative;min-height:100vh}
[hidden]{display:none!important}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(closest-side,#7A3E18,transparent 70%);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:10vmax;background:radial-gradient(closest-side,#B07A2A,transparent 70%);opacity:.3;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:48vmax;height:48vmax;left:20vmax;bottom:-26vmax;background:radial-gradient(closest-side,#5C2B14,transparent 70%);animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(7vmax,5vmax) scale(1.12)}}@keyframes drift2{to{transform:translate(-8vmax,6vmax) scale(.92)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.18)}}
.tools,#root{position:relative;z-index:1}
.tools{max-width:297mm;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.tools a,.tools button{font:700 13px var(--body);color:var(--cream);text-decoration:none;padding:10px 18px;border:1px solid var(--edge2);background:rgba(255,232,200,.06);border-radius:12px;cursor:pointer;transition:transform .3s,box-shadow .3s,background .3s}
.tools a:hover,.tools button:hover{transform:translateY(-2px);background:rgba(255,232,200,.11);box-shadow:0 0 24px rgba(224,179,106,.18)}
.tools .go{background:var(--metal);color:#2A1608;border:0;box-shadow:0 10px 30px rgba(224,179,106,.32)}
#root{display:flex;flex-direction:column;align-items:center;gap:22px}

/* ---- the page ---- */
.pg{width:297mm;height:209.6mm;zoom:var(--z);flex:none;border-radius:22px;border:1px solid var(--edge);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:30px 40px 18px;
  background:radial-gradient(60% 50% at 0 0,rgba(199,125,69,.17),transparent 65%),radial-gradient(50% 45% at 100% 0,rgba(224,179,106,.13),transparent 65%),linear-gradient(160deg,#281910 0%,#160D08 55%,#0E0805 100%);
  box-shadow:0 40px 100px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,235,205,.14),inset 0 0 90px rgba(224,179,106,.03)}
.pg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,210,122,.55),rgba(224,179,106,0) 30%,rgba(224,179,106,0) 70%,rgba(255,210,122,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(224,179,106,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(224,179,106,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(60% 60% at 88% 6%,#000,transparent 75%);mask-image:radial-gradient(60% 60% at 88% 6%,#000,transparent 75%);pointer-events:none}
.pg>*{position:relative;z-index:1}
.corner{position:absolute!important;width:18px;height:18px;border:2px solid var(--gold);opacity:.7;z-index:2;filter:drop-shadow(0 0 5px rgba(255,210,122,.5))}
.corner.tl{left:14px;top:14px;border-right:0;border-bottom:0}.corner.br{right:14px;bottom:14px;border-left:0;border-top:0}
.eyebrow{font:500 10.5px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;text-shadow:0 0 14px rgba(255,210,122,.35)}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--metal);box-shadow:0 0 8px rgba(255,210,122,.7)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:500;letter-spacing:-.03em;color:var(--cream)}
h1{font-size:25px;line-height:1.2;overflow-wrap:anywhere}
h2{font-size:22px;line-height:1.15}
.gold{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:.07em;padding:4px 11px;border:1px solid var(--edge2);border-radius:999px;color:var(--champ);background:rgba(255,232,200,.05);white-space:nowrap}
.chip.cov{border-style:dashed;color:var(--soft)}
.chip.sp{border-color:rgba(243,217,168,.35);color:var(--soft)}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,235,205,.1),0 14px 36px rgba(0,0,0,.28)}
.foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--edge);padding-top:8px;font:500 9px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.foot span:nth-child(2){flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 14px}

/* cover band */
.cover{display:grid;grid-template-columns:1fr 112px;gap:24px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--edge)}
.cover h1{margin:10px 0 8px}
.bl{font:600 15.5px/1.5 var(--body);color:var(--champ);margin:0 0 11px;max-width:820px}
.orb{width:104px;aspect-ratio:1;position:relative;justify-self:center}
.orb i{position:absolute;border-radius:50%}
.orb .core{inset:26%;background:radial-gradient(circle at 34% 28%,#FFF6E0,#F3D9A8 22%,#E0B36A 48%,#8A4F22 82%,#4A260F);box-shadow:0 0 34px 5px rgba(255,210,122,.42),0 0 90px 26px rgba(199,125,69,.25);animation:pulse 6s ease-in-out infinite}
.orb .r1{inset:8%;border:1px solid rgba(243,217,168,.5);animation:spin 40s linear infinite}
.orb .r1::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#FFE3A6;box-shadow:0 0 10px 2px rgba(255,210,122,.9)}
.orb .r2{inset:-4%;border:1px dashed rgba(224,179,106,.3);animation:spin 70s linear infinite reverse}
.ph{display:flex;align-items:baseline;gap:18px;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--edge)}
.ph h2{margin-top:8px}

/* columns: the paginator fills these; overflow is measured, never shown */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:var(--gc,1fr 1fr);grid-template-rows:minmax(0,1fr);gap:26px}
.col{min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.col>*{flex:none;zoom:var(--u,1)}.pg.t1 .col>*{zoom:var(--u1,1)}
.col.e{visibility:hidden}
.col.side{padding:14px 16px;gap:12px}
.pg.t1 .cols{--gc:1.22fr 1fr}.pg.t2 .cols{--gc:1fr 1fr 1fr;gap:18px}

/* typography of content */
.ov p{margin:0;font-size:13.2px;line-height:1.6;color:#F2E4D0;font-weight:500}
.ov:first-child p::first-letter{font:500 29px/.9 var(--display);float:left;padding:4px 8px 0 0;color:var(--gold)}
.blk h4{margin:0 0 8px;font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:9px}
.blk h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
ol.dec{list-style:none;margin:0;padding:0;counter-reset:d;display:grid;gap:6px}
ol.dec li{counter-increment:d;position:relative;padding-left:26px;font-size:11.8px;line-height:1.42;color:#F2E4D0}
ol.dec li::before{content:counter(d);position:absolute;left:0;top:1px;font:500 10px/1 var(--mono);width:18px;height:18px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--edge2);color:var(--gold)}
.dl{display:grid;gap:6px}
.dl .r{padding:4px 10px 5px;border:1px solid var(--edge);border-radius:11px;background:rgba(255,232,200,.035)}
.dl .r b{display:block;font-size:12px;line-height:1.4;font-weight:700;color:var(--cream)}
.dl .m{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:3px;font:500 10px var(--mono);color:var(--soft)}
.dl .d{font-size:10.5px;line-height:1.35;color:var(--soft);margin-top:2px}
.st{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid;color:var(--champ)}
.st.new{color:#FFD27A;border-color:rgba(255,210,122,.55);background:rgba(255,210,122,.08)}
.st.moved{color:#E8A06A;border-color:rgba(232,160,106,.55);background:rgba(232,160,106,.09)}
.st.confirmed{color:#A9D1A0;border-color:rgba(169,209,160,.5);background:rgba(169,209,160,.08)}
.st.risk{color:#F08C6E;border-color:rgba(240,140,110,.6);background:rgba(240,140,110,.1)}
.st.oth{color:var(--soft);border-color:var(--edge2)}

/* detail topics */
.tp{padding:9px 11px 10px;border-radius:13px}
.tp .th{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.tp h3{font-size:11.8px;line-height:1.3;letter-spacing:-.02em;font-weight:500}
.tp .n{font:500 11px var(--display);margin-right:6px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.tp .chips{gap:4px;margin-top:2px}.tp .chip{font-size:8.5px;padding:1px 7px}
.tp p{margin:6px 0 0;font-size:11.4px;line-height:1.5;color:#EBDCC7}

/* page 3 */
.ac{display:grid;gap:6px}
.ac .r{padding:6px 10px 7px;border-top:1px solid var(--edge)}
.ac .r:first-child{border-top:0}
.ac .h{display:flex;justify-content:space-between;gap:8px;font:500 10px var(--mono)}
.ac .h b{color:var(--champ);font-weight:500;letter-spacing:.04em}.ac .h em{color:var(--gold);font-style:normal}
.ac .r p{margin:2px 0 0;font-size:11.4px;line-height:1.42;color:#F2E4D0}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nm{padding:8px 10px 7px;border-radius:13px}
.nm b{display:block;font:500 15px/1.1 var(--display);letter-spacing:-.04em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.nm span{display:block;margin-top:4px;font-size:10.8px;line-height:1.35;font-weight:700;color:var(--cream)}
.nm small{display:block;margin-top:2px;font-size:10px;line-height:1.35;color:var(--soft);font-weight:500}
.tl{display:grid;gap:8px}
.tl .r{padding:6px 10px;border-radius:12px}
.tl .r b{font-size:12.2px;font-weight:700;color:var(--champ)}
.tl .r p{margin:2px 0 0;font-size:10.8px;line-height:1.42;color:var(--soft)}
.tl .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
ul.pl{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.pl li{position:relative;padding-left:15px;font-size:11.2px;line-height:1.45;color:#EBDCC7}
ul.pl li::before{content:"";position:absolute;left:1px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(255,210,122,.7)}
ul.pl.q li::before{background:none;border:1.5px solid var(--gold);width:7px;height:7px}
.endnote{font:500 9.5px var(--mono);letter-spacing:.08em;color:var(--mute);margin-top:2px}

@media screen and (max-width:760px){
  body{padding:14px 0 40px}
  .tools{padding:0 16px}
  #root{gap:14px;align-items:stretch}
  .pg,.pg *{max-width:100%}.pg{min-width:0}
  .tools{flex-wrap:wrap}
  .pg{width:100%;height:auto;zoom:1;border-radius:0;border-left:0;border-right:0;padding:24px 16px 16px;gap:16px}
  .cover{grid-template-columns:1fr}.orb{display:none}
  h1{font-size:21px}.bl{font-size:14.5px}
  .cols,.pg.t1 .cols,.pg.t2 .cols{display:flex;flex-direction:column;gap:18px}
  .col{overflow:visible}.col.side{padding:16px}
  .ov p{font-size:14px}.tp p{font-size:13px}.tp h3{font-size:13.5px}ol.dec li{font-size:13px}
  .foot span:nth-child(2){display:none}
}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:var(--bg0)!important;padding:0;margin:0;min-height:0}
  .aurora,.tools{display:none!important}
  #root{display:block;gap:0}
  .pg{zoom:1!important;margin:0;border-radius:0;border:0;box-shadow:none;width:297mm;height:209.6mm;break-after:page;page-break-after:always;break-inside:avoid;overflow:hidden}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg::before{display:none}
  .tp,.nm,.dl .r,.tl .r{break-inside:avoid}
  .orb .halo{display:none}
  .gold,.tp .n,.nm b{-webkit-text-fill-color:#E0B36A!important;background:none!important;color:#E0B36A!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="tools" id="tools">
  <a href="/">Back to Meridian</a>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" id="copyBtn">Copy summary</button><button class="go" type="button" id="printBtn">Save as PDF</button></div>
</div>
<div id="root"><section class="pg"><div class="eyebrow">Meridian executive report</div><p class="dim" style="color:var(--soft)">Loading the meeting…</p></section></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function mmss(t){t=Math.max(0,Math.floor(t||0));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
  function mins(t){return Math.max(1,Math.round((t||0)/60))+" min"}
  function txt(x){if(x==null)return "";if(typeof x==="object")return Object.keys(x).map(function(k){return x[k]}).filter(function(v){return typeof v!=="object"&&v!==""&&v!=null}).join(" · ");return String(x)}
  function arr(x){return Array.isArray(x)?x.filter(function(v){return v!=null&&txt(v).trim()!==""}):[]}
  function paras(t){return String(t||"").split(/\n+/).map(function(x){return x.trim()}).filter(Boolean)}
  var LANG={en:"English",hi:"Hindi",hinglish:"Hinglish",mr:"Marathi",ta:"Tamil",te:"Telugu",bn:"Bengali",gu:"Gujarati"};

  /* ---------- sample for design preview: ?demo=1  (demo=old drops notes.exec, demo=long has 14 detail topics) ---------- */
  var DEMO={title:"SEO, AEO and ASO strategy update: planning brief",you:"Sumit",created:1794996178,duration:2430,language:"en",words:6150,
   notes:{headline:"SEO, AEO and ASO strategy update: planning brief",kind:"Planning brief",
    exec:{
     bottom_line:"Hari briefed two analysts on a two to three page organic growth update across web search, AI answers and the app stores, due to leadership tomorrow.",
     overview:[
      "Hari briefed Sumit and Neha on one document he needs by tomorrow: a two to three page strategy update on organic growth across web search, AI answer engines and the app stores. The aim is a view that senior leadership can read in ten minutes, showing where Univest stands today, what changed over the last six months, where the team expects to be next quarter and what it will take to get there. He asked for plain language, a few well chosen charts and no padding, and stressed that numbers matter more than adjectives.",
      "The brief has eleven sections: the six month trend, the plan and projection, keyword positions for the top 30 transactional terms and the next 500 from SEMrush and AppTweak, internal targets, a gold standard comparison against Groww and MoneyControl, current processes, the ideal plan, the main initiatives, action points and timelines. Hari wants every claim backed by a figure and every gap shown against a named competitor rather than described in the abstract. The projection should be a range with its assumptions written beside it, so nobody reads it as a promise.",
      "The meeting closed with ownership and timing. Sumit takes the web and AI answer sections, Neha takes app store optimisation and the competitor comparison, and Hari writes the plan, targets and summary. Drafts are due this evening so there is time for one short review before the final document goes out tomorrow. Two points remain open: whether finance approves the AppTweak credits in time, and how to measure visibility inside AI answers, where no reliable tool exists yet. The team will state its method openly instead of guessing."],
     decisions:["Deliver a two to three page strategy update by tomorrow, 11 am.","Track the top 30 keywords in detail and the next 500 in a table.","Use SEMrush for web data and AppTweak for app store data.","Use Groww and MoneyControl as the gold standard.","Show the projection as a range, with its assumptions.","Hold a 20 minute review tonight at 7 pm before sign-off."],
     detail:[
      {title:"Purpose of the document and the last six months",start:0,end:470,speakers:["Hari", "Sumit"],paragraph:"Hari explained why the document exists: leadership wants one clear view of organic growth, and the last update was a long deck that nobody finished reading. He wants two to three pages in plain language that can be read in about ten minutes, with each section leading with the conclusion, then the evidence, then the action. The first section looks back over six months. Sumit will pull monthly web sessions, organic signups and store installs onto one simple trend and mark the dates that explain each bend, such as the core algorithm update and the finance article refresh, so readers see cause and effect rather than a bare curve. Branded and non branded traffic behave very differently, so they will be split. Hari also wants one sentence each on what worked, what did not and what the team learned."},
      {title:"Plan and projection",start:470,end:800,speakers:["Hari"],paragraph:"The second section turns the history into a plan for the next quarter. Hari will write it himself, using the trend data from Sumit and Neha as the base. The projection must be shown as a range, with a low, expected and high case and the assumptions written under each, such as how many pages ship and how quickly rankings move. He was firm that a single number would be read as a promise, and he does not want the team held to a figure that depends on factors outside its control, like search engine updates. The plan should name the three or four initiatives that drive the range and show how much of the movement each one is expected to deliver, so leadership can see where effort creates the most return and decide what to back."},
      {title:"Keyword positions: top 30 and the next 500",start:800,end:1130,speakers:["Hari", "Sumit", "Neha"],paragraph:"The third section is the keyword picture. Sumit will export the top 30 transactional keywords from SEMrush with current position, change over six months and the best competitor ranking above Univest. Neha will do the same for app store keywords using AppTweak. The next 500 keywords appear as a summary table grouped by theme, with counts in positions one to three, four to ten and beyond, so the table shows where the team is close to winning. Neha warned that the AppTweak trial ends on Friday and the larger export needs credits, so Hari will ask finance for approval first thing tomorrow. If credits slip, Neha will use the trial export for the top 30 and mark the 500 as pending rather than delay the whole document, and Hari agreed that this is a fair fallback."},
      {title:"Internal targets and the gold standard",start:1130,end:1450,speakers:["Hari", "Neha"],paragraph:"This section sets targets and compares Univest with the best in the market. Hari will draft the internal targets from numbers already agreed with product, and flag any that are still unconfirmed so nobody mistakes a draft for a commitment. For the gold standard the group chose Groww and MoneyControl, because they win the transactional searches Univest cares about most. Neha will build a side by side table covering ranking, page quality, app listing strength and content depth, and end it with a short list of what the leaders do that Univest does not yet do. Hari asked that each gap be written as a plain fact, for example the number of pages a competitor has for a topic against Univest's number, and not as an opinion. A third competitor was mentioned, but the name was hard to hear, so it is parked for now."},
      {title:"Current processes and the ideal plan",start:1450,end:1780,speakers:["Hari", "Sumit"],paragraph:"Sumit described how the team works today: briefs arrive by chat, keyword research is done per request, content goes live without a ranking check, and results are reviewed only when someone asks. There is no standing keyword list and no owner for the monthly numbers. Hari wants this written honestly, including the delays, because it makes the case for change better than any argument. The ideal plan is a steady weekly rhythm built on a standing keyword list, a content calendar tied to it, a quality check before publishing, and a Monday ranking review that anyone can read in five minutes. Sumit added that the rhythm should also include a monthly look at what AI answer engines say about Univest, even though no reliable tool exists for it yet. The team will describe its manual method openly instead of guessing."},
      {title:"Initiatives and priorities",start:1780,end:2090,speakers:["Hari", "Sumit", "Neha"],paragraph:"The initiatives section lists what the team will actually do, ranked by expected effect and effort. Hari suggested four candidates: rebuilding the top transactional pages, a refresh programme for older articles, a structured data project aimed at AI answers, and a rewrite of the Hindi and English store listings. Neha argued that the store listings are the cheapest and fastest and should go first. Sumit preferred the transactional pages because they carry the most revenue and every week of delay costs signups. Instead of settling the argument in the room, they agreed to show both with an effort score and an impact score and let the reasoning speak. Hari will decide the final order after tonight's review and will state it as a recommendation with the trade-off visible, not as a done deal."},
      {title:"Action points and timelines",start:2090,end:2430,speakers:["Hari", "Sumit", "Neha"],paragraph:"Hari closed by fixing owners and dates. Sumit delivers the keyword export by 3 pm today and his two sections by 6 pm. Neha delivers the app store section and the competitor table by 6 pm. Hari writes the plan, projection and targets, requests the AppTweak credits and runs a 20 minute review at 7 pm, moved from 5 pm so the analysts have more time. The final document goes to leadership tomorrow at 11 am. He asked everyone to message him early if a number looks wrong instead of fixing it quietly, because a visible gap is easier to explain than a hidden one. He also asked that every chart carry its source and date, and that nothing be rounded in a way that flatters the result. The meeting ended on time."}
     ]},
    summary:"Hari briefed two analysts on a two to three page organic growth update, due tomorrow.",

  function oldDemo(){var d=JSON.parse(JSON.stringify(DEMO)),n=d.notes,e=n.exec;n.overview=e.overview.join("\n\n");n.topics=e.detail.map(function(t){return{title:t.title,paragraph:t.paragraph}});n.decisions=e.decisions;delete n.exec;delete n.coverage;return d}

  function build(m){

    chunks(dls,1).forEach(function(c,i){u1.push(tight({col:1,cont:"Deadlines, continued",el:el("div","blk",(i?"":'<h4>Deadlines</h4>')+'<div class="dl">'+c.map(function(d){
      var ch=String(d.change||"").toLowerCase(),cls=/risk/.test(ch)?"risk":/mov|chang/.test(ch)?"moved":/confirm/.test(ch)?"confirmed":/new/.test(ch)?"new":"oth";
      return '<div class="r" title="'+esc(d.detail||"")+'"><b>'+esc(d.item||txt(d))+'</b><div class="m">'+(ch?'<span class="st '+cls+'">'+esc(ch)+"</span>":"")+(d.date?"<span>"+esc(d.date)+"</span>":"")+(d.owner?"<span>"+esc(d.owner)+"</span>":"")+(d.detail&&d.detail.length<=30?'<span style="color:var(--mute)">'+esc(d.detail)+"</span>":"")+"</div>"+"</div>"}).join("")+"</div>")},i))});
